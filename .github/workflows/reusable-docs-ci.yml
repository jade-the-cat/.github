name: Docs CI (reusable)

# Reusable docs gate for the MkDocs site: a strict build (catches broken nav/links) plus the
# internal-anchor check (catches broken #fragment links, incl. CJK-slug breakage). Call with:
#   jobs:
#     docs-ci:
#       uses: jade-pet/.github/.github/workflows/reusable-docs-ci.yml@main
# Note: Mermaid syntax is validated locally (mermaid-cli); not gated here to avoid a headless-
# Chromium dependency in CI.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Sync deps
        run: uv sync
      - name: Strict build
        run: uv run mkdocs build --strict
      - name: Internal anchor check
        run: python3 scripts/check_anchors.py
