name: API spec lint (reusable)

# Reusable design-time API gate: generate the OpenAPI spec from drf-spectacular and lint it with
# Spectral against the org-shared ruleset (spectral/jade.yaml in this .github repo). Fails on
# ERRORS only; AIP-leaning rules are warnings that ratchet to error as the API migrates (D9/D10).
# Call from a Django/DRF repo with:
#   jobs:
#     api-spec-lint:
#       uses: jade-pet/.github/.github/workflows/reusable-api-spec-lint.yml@main
on:
  workflow_call:

permissions:
  contents: read

jobs:
  spectral:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout caller repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Checkout shared harness ruleset (jade-pet/.github)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jade-pet/.github
          path: .harness
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Sync deps
        run: uv sync
      - name: Generate OpenAPI spec
        run: uv run python manage.py spectacular --file openapi.yaml
      - name: Spectral lint (fail on error)
        run: npx -y @stoplight/spectral-cli@6.16.3 lint openapi.yaml --ruleset .harness/spectral/jade.yaml --fail-severity error
