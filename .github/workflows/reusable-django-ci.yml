name: Django CI (reusable)

# Reusable backend gate: lint + system check + tests. Call from a Django repo with:
#   jobs:
#     django-ci:
#       uses: jade-pet/.github/.github/workflows/reusable-django-ci.yml@main
# uv brings its own Python (requires-python pinned in the repo's pyproject); dev settings use
# sqlite + eager Celery, so no Postgres/Redis is needed for the gate.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Sync deps
        run: uv sync
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Django system check
        run: uv run python manage.py check
      - name: Tests
        run: uv run python manage.py test
